<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Logs - AttendEase</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .terminal {
            font-family: 'Courier New', Courier, monospace;
            background-color: #0f172a;
            color: #10b981;
        }
    </style>
</head>
<body class="bg-slate-900 h-screen flex flex-col pt-6 pb-6 px-4 sm:px-8">
    <div class="max-w-5xl mx-auto w-full flex-grow flex flex-col bg-slate-800 rounded-lg shadow-2xl border border-slate-700 overflow-hidden">
        
        <div class="bg-slate-900 border-b border-slate-700 px-6 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-white flex items-center">
                <svg class="w-6 h-6 mr-3 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                </svg>
                Permanent Server History
            </h1>
            <a href="/" class="text-sm text-indigo-400 hover:text-indigo-300 transition-colors">← Back to App</a>
        </div>

        <div class="flex-grow p-6 terminal overflow-y-auto" id="log-container">
            <pre id="log-content" class="whitespace-pre-wrap word-break text-sm sm:text-base leading-relaxed tracking-tight">Loading logs...</pre>
        </div>
        
    </div>

    <script>
        async function fetchLogs() {
            try {
                const res = await fetch('/api/logs_data');
                const data = await res.json();
                const logContent = document.getElementById('log-content');
                
                // Only autoscroll if user was already at the bottom
                const container = document.getElementById('log-container');
                const isAtBottom = container.scrollHeight - container.scrollTop <= container.clientHeight + 50;

                logContent.textContent = data.logs;

                if (isAtBottom) {
                    container.scrollTop = container.scrollHeight;
                }
            } catch (e) {
                console.error("Failed to fetch logs");
            }
        }

        // Fetch immediately, then every 2 seconds
        fetchLogs();
        setInterval(fetchLogs, 2000);
    </script>
</body>
</html>
